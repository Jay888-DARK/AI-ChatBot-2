<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gemini Chat — GPT UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Gemini Chat</h2>
      <div class="info">
        <p>Model: <span id="model-name">loading…</span></p>
        <p id="status">Status: <span class="ok">ready</span></p>
      </div>
      <footer class="footer">Demo — do not expose keys in production</footer>
    </aside>

    <main class="main">
      <div id="chat-box" class="chat-box" aria-live="polite"></div>

      <div class="composer">
        <input id="user-input" type="text" placeholder="Ask anything..." autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
