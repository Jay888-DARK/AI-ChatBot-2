<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My GPT</title>
<style>
body {
    margin: 0;
    background: #121212;
    font-family: Arial;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
}
#chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}
.message {
    margin-bottom: 15px;
    padding: 12px 16px;
    max-width: 70%;
    border-radius: 12px;
    line-height: 1.4;
}
.user {
    background: #0059ff;
    align-self: flex-end;
}
.bot {
    background: #2a2a2a;
    align-self: flex-start;
}
#input-area {
    display: flex;
    padding: 10px;
    background: #1e1e1e;
}
#user-input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    outline: none;
}
button {
    padding: 12px 20px;
    margin-left: 10px;
    background: #0059ff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.typing-dots {
    display: inline-block;
}
.typing-dots span {
    animation: blink 1.4s infinite both;
}
@keyframes blink {
    0% { opacity: .2; }
    20% { opacity: 1; }
    100% { opacity: .2; }
}
</style>
</head>
<body>

<div id="chat-container"></div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="Ask something..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
const API_KEY = "AIzaSyDMWjtHM19Ncp0Kll2v33cak6L_dVhvJwQ";   // ← Replace correctly (without quotes error)
const MODEL_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

const chatContainer = document.getElementById("chat-container");

function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.innerHTML = text;
    chatContainer.appendChild(msg);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function addTyping() {
    const msg = document.createElement("div");
    msg.classList.add("message", "bot");
    msg.id = "typing";
    msg.innerHTML = `
        <div class="typing-dots">
            <span>•</span> <span>•</span> <span>•</span>
        </div>`;
    chatContainer.appendChild(msg);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function removeTyping() {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
}

async function sendMessage() {
    let text = document.getElementById("user-input").value.trim();
    if (!text) return;

    addMessage(text, "user");
    document.getElementById("user-input").value = "";

    addTyping();

    try {
        const response = await fetch(MODEL_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text }]
                }]
            })
        });

        const data = await response.json();
        removeTyping();

        if (data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            addMessage(data.candidates[0].content.parts[0].text, "bot");
        } else {
            addMessage("❌ No Response (model error)", "bot");
            console.log("API ERROR →", data);
        }
    } catch (err) {
        removeTyping();
        addMessage("❌ Network Error", "bot");
        console.log("Network error:", err);
    }
}
</script>

</body>
</html>
